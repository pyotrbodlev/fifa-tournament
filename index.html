<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA Cup Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --pitch-dark: #0a2417;
  --pitch: #0e321f;
  --card: #123a26;
  --card-2: #163f29;
  --line: #22553a;
  --text: #eaf3ec;
  --text-dim: #9db8a9;
  --lime: #d4ff3f;
  --lime-dim: #a8cc32;
  --gold: #f4c95d;
  --red: #e8564f;
  --radius: 10px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 90px),
    linear-gradient(180deg, var(--pitch-dark) 0%, var(--pitch) 100%);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:0 0 60px 0;
}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px;}

header.app-header{
  text-align:center;
  padding:34px 18px 22px 18px;
  position:relative;
}
header.app-header::before{
  content:"";
  position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:120px;height:3px;
  background:var(--lime);
  border-radius:2px;
}
.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:3px;
  color:var(--lime-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
h1.title{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:44px;
  letter-spacing:1px;
  text-transform:uppercase;
  margin:0;
  color:var(--text);
}
h1.title span{color:var(--lime);}
.subtitle{color:var(--text-dim);font-size:14px;margin-top:6px;}

.admin-bar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:14px;
}
.admin-badge{
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:1px;
  color:var(--lime);
  background:var(--card-2);
  border:1px solid var(--lime-dim);
  padding:5px 12px;
  border-radius:999px;
}
.viewer-note{
  color:var(--text-dim);
  font-size:12px;
  font-family:'Space Mono',monospace;
  text-align:center;
  padding:10px 0 0 0;
}

nav.tabs{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:26px 0 24px 0;
  flex-wrap:wrap;
}
.tab-btn{
  font-family:'Oswald',sans-serif;
  font-size:14px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  background:transparent;
  border:1px solid var(--line);
  color:var(--text-dim);
  padding:10px 22px;
  border-radius:999px;
  cursor:pointer;
  transition:all .15s ease;
}
.tab-btn:hover{border-color:var(--lime-dim);color:var(--text);}
.tab-btn.active{
  background:var(--lime);
  border-color:var(--lime);
  color:#0a2417;
  font-weight:600;
}
.tab-btn:disabled{opacity:.35;cursor:not-allowed;}
.tab-btn:disabled:hover{border-color:var(--line);color:var(--text-dim);}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:18px;
}
.card h2{
  font-family:'Oswald',sans-serif;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:20px;
  margin:0 0 16px 0;
  display:flex;
  align-items:center;
  gap:10px;
}
.card h2 .count{
  font-family:'Space Mono',monospace;
  font-size:13px;
  background:var(--card-2);
  color:var(--lime);
  padding:2px 9px;
  border-radius:999px;
  font-weight:400;
  letter-spacing:0;
}

.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px;}
.field label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);}
input[type=text], input[type=number], input[type=password], select{
  background:var(--pitch-dark);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 12px;
  border-radius:6px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  outline:none;
}
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus{border-color:var(--lime-dim);}
input[type=number]{width:64px;text-align:center;font-family:'Space Mono',monospace;}

.btn{
  font-family:'Oswald',sans-serif;
  letter-spacing:1px;
  text-transform:uppercase;
  font-size:13px;
  background:var(--lime);
  color:#0a2417;
  border:none;
  padding:11px 20px;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
  transition:transform .1s ease, background .15s ease;
}
.btn:hover{background:var(--lime-dim);}
.btn:active{transform:scale(.97);}
.btn:disabled{background:var(--line);color:var(--text-dim);cursor:not-allowed;}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.secondary:hover{border-color:var(--red);color:var(--red);}
.btn.small{padding:7px 14px;font-size:11px;}
.btn.ghost{background:transparent;color:var(--lime-dim);padding:6px 10px;font-size:11px;border:1px solid transparent;}
.btn.ghost:hover{border-color:var(--lime-dim);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  font-family:'Space Mono',monospace;
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:1px;
  color:var(--text-dim);
  text-align:center;
  padding:8px 6px;
  border-bottom:1px solid var(--line);
}
th:first-child, td:first-child{text-align:left;}
td{padding:9px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.04);}
tr:last-child td{border-bottom:none;}
td.name{font-weight:600;}
td.pts{font-family:'Space Mono',monospace;color:var(--lime);font-weight:700;}
.qualified{color:var(--lime);}
.qualified td.name::before{content:"▸ ";color:var(--lime);}

.player-list{list-style:none;padding:0;margin:0;}
.player-list li{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 4px;border-bottom:1px solid rgba(255,255,255,0.04);
}
.player-list li:last-child{border-bottom:none;}
.player-name{font-weight:600;}
.player-team{color:var(--text-dim);font-size:12px;margin-left:8px;}
.player-group{
  font-family:'Space Mono',monospace;
  font-size:11px;
  background:var(--card-2);
  color:var(--lime-dim);
  padding:3px 9px;
  border-radius:999px;
}
.empty-state{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;}

.match-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 4px;border-bottom:1px solid rgba(255,255,255,0.04);
  flex-wrap:wrap;
}
.match-row:last-child{border-bottom:none;}
.match-teams{flex:1;min-width:180px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;gap:8px;}
.match-score-form{display:flex;align-items:center;gap:6px;}
.vs{color:var(--text-dim);font-family:'Space Mono',monospace;font-size:11px;}
.score-display{
  font-family:'Space Mono',monospace;
  font-size:16px;font-weight:700;color:var(--lime);
  background:var(--pitch-dark);
  padding:5px 12px;border-radius:6px;
  min-width:64px;text-align:center;
}
.awaiting-note{color:var(--text-dim);font-size:12px;font-family:'Space Mono',monospace;}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;}
.progress-bar{height:6px;background:var(--pitch-dark);border-radius:999px;overflow:hidden;margin:6px 0 18px 0;}
.progress-bar-fill{height:100%;background:var(--lime);transition:width .2s ease;}

.bracket{display:flex;gap:36px;overflow-x:auto;padding:10px 4px 20px 4px;}
.bracket-round{display:flex;flex-direction:column;justify-content:space-around;gap:20px;min-width:230px;}
.round-label{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:12px;color:var(--gold);text-align:center;margin-bottom:6px;
}
.match-card{
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
}
.match-card.decided{border-color:var(--lime-dim);}
.slot{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;font-size:13px;}
.slot.winner{color:var(--lime);font-weight:700;}
.slot.bye{color:var(--text-dim);font-style:italic;}
.slot-score{font-family:'Space Mono',monospace;font-size:13px;}
.ko-inputs{display:flex;gap:6px;align-items:center;margin-top:8px;justify-content:center;}
.ko-inputs input{width:46px;}
.champion-banner{
  text-align:center;
  padding:36px 20px;
  background:linear-gradient(135deg, var(--card) 0%, var(--card-2) 100%);
  border:1px solid var(--gold);
  border-radius:var(--radius);
}
.champion-banner .cup{font-size:44px;}
.champion-banner h2{
  font-family:'Oswald',sans-serif;font-size:30px;text-transform:uppercase;
  color:var(--gold);margin:10px 0 4px 0;letter-spacing:1px;
}
.champion-banner .team{color:var(--text-dim);font-size:15px;}

.tourney-actions{display:flex;justify-content:flex-end;margin-bottom:14px;}
.penalty-note{font-size:11px;color:var(--gold);margin-top:6px;text-align:center;}
.footer-note{text-align:center;color:var(--text-dim);font-size:11px;margin-top:30px;font-family:'Space Mono',monospace;}

.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(5,15,10,0.72);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
  padding:20px;
}
.modal-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px;
  width:100%;
  max-width:340px;
}
.modal-card h2{margin-top:0;}
.modal-error{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

@media (max-width:600px){
  h1.title{font-size:30px;}
  .match-teams{flex-direction:column;align-items:flex-start;gap:2px;}
  .vs{display:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="eyebrow">Matchday Control</div>
    <h1 class="title">FIFA <span>CUP</span> MANAGER</h1>
    <div class="subtitle" id="subtitle">Register squads, run the group stage, settle it on penalties.</div>
    <div class="admin-bar" id="admin-bar"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="app"></div>
  <div class="footer-note">DATA IS SAVED ON THIS DEVICE/BROWSER ONLY · GROUP STAGE 3PTS WIN / 1PT DRAW</div>
</div>

<div class="modal-overlay" id="admin-modal" style="display:none;">
  <div class="modal-card">
    <h2>Admin login</h2>
    <div class="field">
      <label>Password</label>
      <input type="password" id="admin-password-input" autocomplete="current-password">
    </div>
    <div class="modal-error" id="admin-modal-error"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="admin-modal-cancel" type="button">Cancel</button>
      <button class="btn" id="admin-modal-submit" type="button">Login</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tournament-state';
const ADMIN_SESSION_KEY = 'tournament-admin-session';

// SHA-256 hash of the admin password. Default password is "fifa2026".
// To set your own password: open this page, open the browser console, and run:
//   sha256Hex("your-new-password").then(console.log)
// then paste the printed hash in here as ADMIN_PASSWORD_HASH.
const ADMIN_PASSWORD_HASH = '18148d4b2a772eb20bd9701c3eecfea3b4e96ccf1ecbcac38ed3cddcb93cac9c';

let state = null;
let activeTab = 'squads';
let isAdmin = false;

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
window.sha256Hex = sha256Hex; // exposed so you can generate a new password hash from the console

function defaultState(){
  return {
    players: [],
    phase: 'registration', // registration | groups | knockout | finished
    advancePerGroup: 2,
    groups: [],
    knockout: null
  };
}

// ---------- persistence (per browser/device via localStorage) ----------

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  }catch(e){
    console.error('Storage error', e);
    state = defaultState();
  }
  isAdmin = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1';
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Storage error', e);
  }
}

function getPlayer(id){ return state.players.find(p => p.id === id); }

// ---------- admin auth ----------

function openAdminModal(){
  document.getElementById('admin-modal-error').textContent = '';
  document.getElementById('admin-password-input').value = '';
  document.getElementById('admin-modal').style.display = 'flex';
  document.getElementById('admin-password-input').focus();
}

function closeAdminModal(){
  document.getElementById('admin-modal').style.display = 'none';
}

async function attemptAdminLogin(){
  const input = document.getElementById('admin-password-input');
  const pwd = input.value;
  const errEl = document.getElementById('admin-modal-error');
  if(!pwd){ errEl.textContent = 'Enter a password.'; return; }
  const hash = await sha256Hex(pwd);
  if(hash === ADMIN_PASSWORD_HASH){
    isAdmin = true;
    sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
    closeAdminModal();
    render();
  } else {
    errEl.textContent = 'Incorrect password.';
    input.value = '';
    input.focus();
  }
}

function adminLogout(){
  isAdmin = false;
  sessionStorage.removeItem(ADMIN_SESSION_KEY);
  render();
}

function renderAdminBar(){
  const bar = document.getElementById('admin-bar');
  if(!bar) return;
  bar.innerHTML = isAdmin
    ? `<span class="admin-badge">🔓 Admin mode</span><button class="btn ghost" id="btn-admin-logout" type="button">Logout</button>`
    : `<button class="btn ghost" id="btn-admin-login" type="button">🔒 Admin login</button>`;
  bar.querySelector('#btn-admin-login')?.addEventListener('click', openAdminModal);
  bar.querySelector('#btn-admin-logout')?.addEventListener('click', adminLogout);
}

document.getElementById('admin-modal-submit').addEventListener('click', attemptAdminLogin);
document.getElementById('admin-modal-cancel').addEventListener('click', closeAdminModal);
document.getElementById('admin-password-input').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); attemptAdminLogin(); }
});
document.getElementById('admin-modal').addEventListener('click', e => {
  if(e.target.id === 'admin-modal') closeAdminModal();
});

// ---------- group / standings logic ----------

function createGroups(players, size){
  const numGroups = Math.max(1, Math.ceil(players.length / 4));
  const shuffled = [...players].sort(() => Math.random() - 0.5);
  const groups = Array.from({length: numGroups}, (_, i) => ({
    id: 'grp_' + i,
    name: 'Group ' + String.fromCharCode(65 + i),
    playerIds: [],
    matches: []
  }));
  shuffled.forEach((p, idx) => groups[idx % numGroups].playerIds.push(p.id));
  groups.forEach(g => {
    const ids = g.playerIds;
    let m = 0;
    for(let i=0;i<ids.length;i++){
      for(let j=i+1;j<ids.length;j++){
        g.matches.push({id: g.id+'_m'+(m++), p1: ids[i], p2: ids[j], s1: null, s2: null, played:false});
      }
    }
  });
  return groups;
}

function standingsFor(group){
  const table = {};
  group.playerIds.forEach(id => table[id] = {id, played:0, won:0, draw:0, lost:0, gf:0, ga:0, gd:0, pts:0});
  group.matches.forEach(m => {
    if(!m.played) return;
    const a = table[m.p1], b = table[m.p2];
    a.played++; b.played++;
    a.gf += m.s1; a.ga += m.s2;
    b.gf += m.s2; b.ga += m.s1;
    if(m.s1 > m.s2){ a.won++; a.pts+=3; b.lost++; }
    else if(m.s1 < m.s2){ b.won++; b.pts+=3; a.lost++; }
    else { a.draw++; b.draw++; a.pts+=1; b.pts+=1; }
  });
  Object.values(table).forEach(t => t.gd = t.gf - t.ga);
  return Object.values(table).sort((x,y) => y.pts-x.pts || y.gd-x.gd || y.gf-x.gf);
}

function allGroupMatchesPlayed(){
  return state.groups.every(g => g.matches.every(m => m.played));
}

function groupProgress(){
  let total=0, played=0;
  state.groups.forEach(g => g.matches.forEach(m => { total++; if(m.played) played++; }));
  return {total, played};
}

// ---------- knockout logic ----------

function buildKnockout(){
  const ranked = state.groups.map(g => standingsFor(g));
  let qualifiers = [];
  for(let r=0; r<state.advancePerGroup; r++){
    ranked.forEach(st => { if(st[r]) qualifiers.push(st[r].id); });
  }
  let size = 1;
  while(size < qualifiers.length) size *= 2;
  while(qualifiers.length < size) qualifiers.push(null);

  const pairs = [];
  for(let i=0;i<qualifiers.length/2;i++){
    pairs.push([qualifiers[i], qualifiers[qualifiers.length-1-i]]);
  }
  const round1 = pairs.map((pair, idx) => {
    const [p1,p2] = pair;
    let winner=null, played=false;
    if(p1 && !p2){ winner=p1; played=true; }
    else if(p2 && !p1){ winner=p2; played=true; }
    return {id:'k0_'+idx, p1, p2, s1:null, s2:null, penaltyWinner:null, winner, played};
  });
  state.knockout = {rounds:[round1], champion:null};
}

function maybeAdvanceKnockout(){
  const ko = state.knockout;
  const last = ko.rounds[ko.rounds.length-1];
  if(!last.every(m => m.played && m.winner)) return;
  if(last.length === 1){
    ko.champion = last[0].winner;
    state.phase = 'finished';
    return;
  }
  const winners = last.map(m => m.winner);
  const next = [];
  for(let i=0;i<winners.length;i+=2){
    next.push({id:'k'+ko.rounds.length+'_'+(i/2), p1:winners[i], p2:winners[i+1], s1:null, s2:null, penaltyWinner:null, winner:null, played:false});
  }
  ko.rounds.push(next);
}

function roundLabel(matchCount){
  if(matchCount === 1) return 'FINAL';
  if(matchCount === 2) return 'SEMI-FINALS';
  if(matchCount === 4) return 'QUARTER-FINALS';
  return 'ROUND OF ' + (matchCount*2);
}

// ---------- rendering ----------

function render(){
  renderAdminBar();
  renderTabs();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(activeTab === 'squads') app.appendChild(renderSquads());
  else if(activeTab === 'groups') app.appendChild(renderGroups());
  else if(activeTab === 'knockout') app.appendChild(renderKnockout());

  document.getElementById('subtitle').textContent =
    state.phase === 'registration' ? 'Register squads, then kick off the tournament.' :
    state.phase === 'groups' ? 'Group stage in progress — enter results as matches finish.' :
    state.phase === 'knockout' ? 'Knockout stage — win or go home.' :
    'Tournament complete.';
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const defs = [
    {id:'squads', label:'Squads'},
    {id:'groups', label:'Groups', disabled: state.phase==='registration'},
    {id:'knockout', label:'Knockout', disabled: state.phase!=='knockout' && state.phase!=='finished'}
  ];
  tabs.innerHTML = defs.map(t =>
    `<button class="tab-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}" ${t.disabled?'disabled':''}>${t.label}</button>`
  ).join('');
  tabs.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
  });
}

function renderSquads(){
  const wrap = document.createElement('div');

  if(state.phase === 'registration'){
    if(isAdmin){
      const regCard = document.createElement('div');
      regCard.className = 'card';
      regCard.innerHTML = `
        <h2>Register a squad</h2>
        <div class="form-row">
          <div class="field"><label>Player name</label><input type="text" id="in-player" placeholder="e.g. Sam"></div>
          <div class="field"><label>Team</label><input type="text" id="in-team" placeholder="e.g. Real Madrid"></div>
          <button class="btn" id="btn-add-player">Add to tournament</button>
        </div>
      `;
      wrap.appendChild(regCard);

      const setupCard = document.createElement('div');
      setupCard.className = 'card';
      setupCard.innerHTML = `
        <h2>Tournament setup</h2>
        <div class="form-row">
          <div class="field">
            <label>Qualifiers per group (advance to knockout)</label>
            <select id="in-advance">
              <option value="1" ${state.advancePerGroup===1?'selected':''}>Top 1</option>
              <option value="2" ${state.advancePerGroup===2?'selected':''}>Top 2</option>
              <option value="3" ${state.advancePerGroup===3?'selected':''}>Top 3</option>
              <option value="4" ${state.advancePerGroup===4?'selected':''}>Top 4</option>
            </select>
          </div>
        </div>
      `;
      wrap.appendChild(setupCard);
    } else {
      const waitCard = document.createElement('div');
      waitCard.className = 'card';
      waitCard.innerHTML = `<div class="empty-state">Waiting for the admin to register players and start the tournament.</div>`;
      wrap.appendChild(waitCard);
    }
  }

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.innerHTML = `<h2>Registered players <span class="count">${state.players.length}</span></h2>`;
  if(state.players.length === 0){
    listCard.innerHTML += `<div class="empty-state">No players yet.</div>`;
  } else {
    const groupOf = {};
    state.groups.forEach(g => g.playerIds.forEach(id => groupOf[id] = g.name));
    const ul = document.createElement('ul');
    ul.className = 'player-list';
    state.players.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span><span class="player-name">${escapeHtml(p.name)}</span><span class="player-team">${escapeHtml(p.team)}</span></span>
        ${groupOf[p.id] ? `<span class="player-group">${groupOf[p.id]}</span>` : (state.phase==='registration' && isAdmin ? `<button class="btn ghost" data-remove="${p.id}">Remove</button>` : '')}
      `;
      ul.appendChild(li);
    });
    listCard.appendChild(ul);
  }
  wrap.appendChild(listCard);

  if(state.phase === 'registration' && isAdmin){
    const actionCard = document.createElement('div');
    actionCard.className = 'card';
    const canStart = state.players.length >= 2;
    actionCard.innerHTML = `
      <h2>Start the tournament</h2>
      <p style="color:var(--text-dim);font-size:13px;margin-top:-8px;">
        Groups of up to 4 will be created automatically and the group-stage schedule will be generated.
        ${state.players.length < 2 ? 'Add at least 2 players first.' : ''}
      </p>
      <button class="btn" id="btn-start" ${canStart?'':'disabled'}>Start tournament</button>
    `;
    wrap.appendChild(actionCard);
  } else if(isAdmin){
    const resetCard = document.createElement('div');
    resetCard.className = 'card';
    resetCard.innerHTML = `
      <h2>Danger zone</h2>
      <p style="color:var(--text-dim);font-size:13px;margin-top:-8px;">Resetting clears all players, groups and results.</p>
      <button class="btn secondary" id="btn-reset">Reset tournament</button>
    `;
    wrap.appendChild(resetCard);
  }

  wrap.querySelector('#btn-add-player')?.addEventListener('click', onAddPlayer);
  wrap.querySelector('#in-team')?.addEventListener('keydown', e => { if(e.key==='Enter') onAddPlayer(); });
  wrap.querySelector('#in-advance')?.addEventListener('change', e => { state.advancePerGroup = parseInt(e.target.value); saveState(); });
  wrap.querySelector('#btn-start')?.addEventListener('click', onStartTournament);
  wrap.querySelector('#btn-reset')?.addEventListener('click', onReset);
  wrap.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.players = state.players.filter(p => p.id !== btn.dataset.remove);
      saveState(); render();
    });
  });

  return wrap;
}

function onAddPlayer(){
  if(!isAdmin) return;
  const nameEl = document.getElementById('in-player');
  const teamEl = document.getElementById('in-team');
  const name = nameEl.value.trim();
  const team = teamEl.value.trim();
  if(!name || !team){ alert('Enter both a player name and a team.'); return; }
  state.players.push({id: uid('p'), name, team});
  saveState(); render();
  document.getElementById('in-player').focus();
}

function onStartTournament(){
  if(!isAdmin || state.players.length < 2) return;
  state.groups = createGroups(state.players, 4);
  state.phase = 'groups';
  activeTab = 'groups';
  saveState(); render();
}

function onReset(){
  if(!isAdmin) return;
  if(!confirm('This clears all players, groups and results. Continue?')) return;
  state = defaultState();
  activeTab = 'squads';
  saveState(); render();
}

function renderGroups(){
  const wrap = document.createElement('div');
  const prog = groupProgress();
  const complete = allGroupMatchesPlayed();

  const top = document.createElement('div');
  top.className = 'card';
  top.innerHTML = `
    <h2>Group stage progress <span class="count">${prog.played}/${prog.total} matches</span></h2>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${prog.total? (prog.played/prog.total*100):0}%"></div></div>
    ${isAdmin ? `
    <div class="tourney-actions">
      <button class="btn" id="btn-to-knockout" ${complete && state.phase==='groups' ? '' : 'disabled'}>
        ${state.phase==='groups' ? 'Proceed to knockout stage' : 'Knockout stage started'}
      </button>
    </div>` : ''}
  `;
  wrap.appendChild(top);

  const grid = document.createElement('div');
  grid.className = 'groups-grid';

  state.groups.forEach(g => {
    const card = document.createElement('div');
    card.className = 'card';
    const table = standingsFor(g);
    const qualifyCount = state.advancePerGroup;

    let tableHtml = `
      <table>
        <thead><tr><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
        <tbody>
    `;
    table.forEach((t, idx) => {
      const p = getPlayer(t.id);
      tableHtml += `<tr class="${idx < qualifyCount ? 'qualified' : ''}">
        <td class="name">${escapeHtml(p.name)}<div style="font-size:11px;color:var(--text-dim);font-weight:400;">${escapeHtml(p.team)}</div></td>
        <td>${t.played}</td><td>${t.won}</td><td>${t.draw}</td><td>${t.lost}</td>
        <td>${t.gf}</td><td>${t.ga}</td><td>${t.gd>0?'+':''}${t.gd}</td>
        <td class="pts">${t.pts}</td>
      </tr>`;
    });
    tableHtml += `</tbody></table>`;

    let matchesHtml = `<div style="margin-top:16px;">`;
    g.matches.forEach(m => {
      const p1 = getPlayer(m.p1), p2 = getPlayer(m.p2);
      const editable = state.phase === 'groups' && isAdmin;
      matchesHtml += `<div class="match-row" data-match="${g.id}:${m.id}">
        <div class="match-teams"><span>${escapeHtml(p1.name)}</span><span class="vs">vs</span><span>${escapeHtml(p2.name)}</span></div>
        ${m.played ?
          `<div class="score-display">${m.s1} – ${m.s2}</div>${editable ? `<button class="btn ghost" data-edit-group-match="${g.id}:${m.id}">Edit</button>` : ''}`
          : editable
          ? `<form class="match-score-form" data-save-group-match="${g.id}:${m.id}">
              <input type="number" min="0" step="1" class="score-input" data-role="s1" value="">
              <span class="vs">:</span>
              <input type="number" min="0" step="1" class="score-input" data-role="s2" value="">
              <button type="submit" class="btn small">Save</button>
            </form>`
          : `<span class="awaiting-note">Awaiting result</span>`
        }
      </div>`;
    });
    matchesHtml += `</div>`;

    card.innerHTML = `<h2>${g.name}</h2>` + tableHtml + matchesHtml;
    grid.appendChild(card);
  });

  wrap.appendChild(grid);

  wrap.querySelector('#btn-to-knockout')?.addEventListener('click', () => {
    if(!isAdmin || !allGroupMatchesPlayed()) return;
    buildKnockout();
    state.phase = 'knockout';
    activeTab = 'knockout';
    saveState(); render();
  });

  wrap.querySelectorAll('[data-save-group-match]').forEach(form => {
    form.addEventListener('submit', e => {
      e.preventDefault();
      if(!isAdmin) return;
      const [gid, mid] = form.dataset.saveGroupMatch.split(':');
      const s1 = parseInt(form.querySelector('[data-role="s1"]').value);
      const s2 = parseInt(form.querySelector('[data-role="s2"]').value);
      if(isNaN(s1) || isNaN(s2) || s1<0 || s2<0){ alert('Enter valid scores for both players.'); return; }
      const grp = state.groups.find(g => g.id === gid);
      const match = grp.matches.find(m => m.id === mid);
      match.s1 = s1; match.s2 = s2; match.played = true;
      saveState(); render();
    });
  });

  wrap.querySelectorAll('[data-edit-group-match]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!isAdmin) return;
      const [gid, mid] = btn.dataset.editGroupMatch.split(':');
      const grp = state.groups.find(g => g.id === gid);
      const match = grp.matches.find(m => m.id === mid);
      match.played = false;
      saveState(); render();
    });
  });

  return wrap;
}

function renderKnockout(){
  const wrap = document.createElement('div');

  if(!state.knockout){
    wrap.innerHTML = `<div class="card"><div class="empty-state">Knockout bracket has not been generated yet.</div></div>`;
    return wrap;
  }

  if(state.phase === 'finished' && state.knockout.champion){
    const champ = getPlayer(state.knockout.champion);
    const banner = document.createElement('div');
    banner.className = 'champion-banner';
    banner.innerHTML = `
      <div class="cup">🏆</div>
      <h2>${escapeHtml(champ.name)}</h2>
      <div class="team">${escapeHtml(champ.team)} — Tournament Champion</div>
    `;
    wrap.appendChild(banner);
  }

  const bracketCard = document.createElement('div');
  bracketCard.className = 'card';
  bracketCard.innerHTML = `<h2>Knockout bracket</h2>`;

  const bracket = document.createElement('div');
  bracket.className = 'bracket';

  state.knockout.rounds.forEach((round, rIdx) => {
    const col = document.createElement('div');
    col.className = 'bracket-round';
    col.innerHTML = `<div class="round-label">${roundLabel(round.length)}</div>`;
    round.forEach(m => {
      const p1 = m.p1 ? getPlayer(m.p1) : null;
      const p2 = m.p2 ? getPlayer(m.p2) : null;
      const card = document.createElement('div');
      card.className = 'match-card' + (m.played ? ' decided' : '');

      const slot1 = p1
        ? `<div class="slot ${m.winner===m.p1?'winner':''}">${escapeHtml(p1.name)} ${m.played && m.s1!==null ? `<span class="slot-score">${m.s1}</span>` : ''}</div>`
        : `<div class="slot bye">BYE</div>`;
      const slot2 = p2
        ? `<div class="slot ${m.winner===m.p2?'winner':''}">${escapeHtml(p2.name)} ${m.played && m.s2!==null ? `<span class="slot-score">${m.s2}</span>` : ''}</div>`
        : `<div class="slot bye">BYE</div>`;

      card.innerHTML = slot1 + slot2;

      if(p1 && p2 && !m.played && isAdmin){
        const formWrap = document.createElement('div');
        formWrap.innerHTML = `
          <form class="ko-inputs" data-save-ko="${rIdx}:${m.id}">
            <input type="number" min="0" step="1" data-role="s1">
            <span class="vs">:</span>
            <input type="number" min="0" step="1" data-role="s2">
            <button type="submit" class="btn small">Save</button>
          </form>
          <div class="ko-penalty" data-penalty-for="${rIdx}:${m.id}" style="display:none;">
            <div class="penalty-note">Level scores — who won on penalties?</div>
            <div class="ko-inputs">
              <select data-role="penalty">
                <option value="">Select winner…</option>
                <option value="${m.p1}">${escapeHtml(p1.name)}</option>
                <option value="${m.p2}">${escapeHtml(p2.name)}</option>
              </select>
            </div>
          </div>
        `;
        card.appendChild(formWrap);
      } else if(p1 && p2 && !m.played && !isAdmin){
        const note = document.createElement('div');
        note.className = 'awaiting-note';
        note.textContent = 'Awaiting result';
        card.appendChild(note);
      } else if(p1 && p2 && m.played && isAdmin){
        const editBtn = document.createElement('button');
        editBtn.className = 'btn ghost';
        editBtn.style.marginTop = '6px';
        editBtn.textContent = 'Edit result';
        editBtn.addEventListener('click', () => {
          m.played = false; m.winner = null; m.s1 = null; m.s2 = null; m.penaltyWinner = null;
          // if later rounds already used this winner, we simply leave them; organizer should resolve manually.
          saveState(); render();
        });
        card.appendChild(editBtn);
      }

      col.appendChild(card);
    });
    bracket.appendChild(col);
  });

  bracketCard.appendChild(bracket);
  wrap.appendChild(bracketCard);

  wrap.querySelectorAll('[data-save-ko]').forEach(form => {
    form.addEventListener('submit', e => {
      e.preventDefault();
      if(!isAdmin) return;
      const [rIdx, mid] = form.dataset.saveKo.split(':');
      const s1 = parseInt(form.querySelector('[data-role="s1"]').value);
      const s2 = parseInt(form.querySelector('[data-role="s2"]').value);
      if(isNaN(s1) || isNaN(s2) || s1<0 || s2<0){ alert('Enter valid scores for both players.'); return; }
      const round = state.knockout.rounds[parseInt(rIdx)];
      const match = round.find(m => m.id === mid);

      if(s1 === s2){
        const penaltyBlock = form.parentElement.querySelector(`[data-penalty-for="${rIdx}:${mid}"]`);
        penaltyBlock.style.display = 'block';
        const sel = penaltyBlock.querySelector('select');
        if(!sel.value){
          sel.focus();
          sel.addEventListener('change', function onSelect(){
            if(!sel.value) return;
            match.s1 = s1; match.s2 = s2;
            match.penaltyWinner = sel.value;
            match.winner = sel.value;
            match.played = true;
            maybeAdvanceKnockout();
            saveState(); render();
          }, {once:true});
          return;
        }
      } else {
        match.s1 = s1; match.s2 = s2;
        match.winner = s1 > s2 ? match.p1 : match.p2;
        match.played = true;
        maybeAdvanceKnockout();
        saveState(); render();
      }
    });
  });

  return wrap;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loadState();
</script>
</body>
</html>
